<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>داشبورد بیت‌کوین</title>
<style>
  :root{
    --bg:#0b1220; --card:#131c2e; --card2:#1a2437; --line:#243049;
    --txt:#e8edf7; --dim:#93a1bd;
    --green:#2ecc8f; --red:#ff6b6b; --amber:#f5b942; --blue:#5aa9ff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{
    margin:0; background:var(--bg); color:var(--txt); font-size:15px;
    font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
    padding:14px 14px calc(28px + env(safe-area-inset-bottom));
  }
  .head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px}
  .head h1{font-size:17px; margin:0; font-weight:600}
  .refresh{
    background:var(--card2); border:1px solid var(--line); color:var(--txt);
    border-radius:10px; padding:8px 14px; font-size:14px; font-family:inherit;
  }
  .refresh:active{background:var(--line)}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px;
        padding:16px; margin-bottom:12px}
  .signal{text-align:center; padding:22px 16px}
  .signal .badge{font-size:26px; font-weight:700; margin-bottom:6px}
  .signal .sub{color:var(--dim); font-size:13px}
  .in{color:var(--green)} .out{color:var(--red)}
  .rows{display:flex; flex-direction:column; gap:10px}
  .row{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
  .row .k{color:var(--dim); font-size:13px}
  .row .v{font-weight:600; font-variant-numeric:tabular-nums}
  .big{font-size:20px}
  h2{font-size:14px; color:var(--dim); margin:0 0 12px; font-weight:600}
  .chart{width:100%; height:110px; display:block; margin-top:8px}
  .legend{display:flex; gap:14px; justify-content:center; font-size:12px;
          color:var(--dim); margin-top:6px}
  .dot{display:inline-block; width:8px; height:2px; vertical-align:middle;
       margin-left:5px; border-radius:2px}
  .trade{display:flex; justify-content:space-between; padding:9px 0;
         border-bottom:1px solid var(--line); font-size:13px}
  .trade:last-child{border-bottom:none}
  .tag{font-size:11px; padding:2px 8px; border-radius:6px; font-weight:600}
  .tag.buy{background:rgba(46,204,143,.15); color:var(--green)}
  .tag.sell{background:rgba(255,107,107,.15); color:var(--red)}
  .note{font-size:12px; color:var(--dim); line-height:1.7; text-align:center;
        margin-top:16px; padding:0 8px}
  .stale{background:rgba(245,185,66,.12); border-color:rgba(245,185,66,.35)}
  .err{color:var(--amber); font-size:13px; text-align:center}
  .muted{color:var(--dim)}
  .skeleton{color:var(--dim)}
</style>
</head>
<body>

<div class="head">
  <h1>داشبورد بیت‌کوین</h1>
  <button class="refresh" onclick="loadAll()">بروزرسانی</button>
</div>

<!-- سیگنال زنده (مستقیم از نوبیتکس) -->
<div class="card signal" id="signalCard">
  <div class="badge skeleton" id="sigBadge">در حال دریافت…</div>
  <div class="sub" id="sigSub">اتصال به نوبیتکس</div>
</div>

<!-- قیمت و میانگین -->
<div class="card">
  <h2>قیمت و میانگین ۱۲۰ روزه</h2>
  <div class="rows">
    <div class="row"><span class="k">قیمت فعلی</span><span class="v big" id="price">—</span></div>
    <div class="row"><span class="k">میانگین ۱۲۰ روزه</span><span class="v" id="ma">—</span></div>
    <div class="row"><span class="k">فاصله تا میانگین</span><span class="v" id="gap">—</span></div>
  </div>
  <svg class="chart" id="chart" viewBox="0 0 320 110" preserveAspectRatio="none"></svg>
  <div class="legend">
    <span><span class="dot" style="background:var(--blue)"></span>قیمت</span>
    <span><span class="dot" style="background:var(--amber)"></span>میانگین ۱۲۰ روزه</span>
  </div>
</div>

<!-- سبد (از فایل ربات) -->
<div class="card" id="portCard">
  <h2>سبد من</h2>
  <div id="portBody" class="skeleton">در حال خواندن…</div>
</div>

<!-- دارایی‌ها -->
<div class="card" id="holdCard" style="display:none">
  <h2>ارزهای داخل سبد</h2>
  <div id="holdBody"></div>
</div>

<!-- معاملات -->
<div class="card" id="tradesCard" style="display:none">
  <h2>آخرین معاملات</h2>
  <div id="tradesBody"></div>
</div>

<div class="note">
  سیگنال زنده مستقیم از نوبیتکس محاسبه می‌شود.<br>
  موجودی سبد از آخرین اجرای ربات روی کامپیوتر می‌آید.
</div>

<script>
const API = "https://apiv2.nobitex.ir";
const MA_DAYS = 120;
const fa = n => n.toLocaleString("fa-IR");
const usd = n => "$" + Math.round(n).toLocaleString("en-US");

// ---------- سیگنال زنده ----------
async function loadSignal(){
  const now = Math.floor(Date.now()/1000);
  const from = now - (MA_DAYS + 80) * 86400;
  const url = `${API}/market/udf/history?symbol=BTCUSDT&resolution=D&from=${from}&to=${now}`;
  const r = await fetch(url, {cache:"no-store"});
  const d = await r.json();
  if(d.s !== "ok" || !d.c || d.c.length < MA_DAYS) throw new Error("داده کافی نیست");

  // کندل ناقص امروز را کنار می‌گذاریم - تصمیم فقط روی کندل کامل‌شده
  const todayStart = now - (now % 86400);
  const rows = d.t.map((t,i)=>({t, c:d.c[i]})).filter(x => x.t < todayStart);

  const closes = rows.map(x=>x.c);
  const last = closes[closes.length-1];
  const ma = closes.slice(-MA_DAYS).reduce((a,b)=>a+b,0) / MA_DAYS;
  const inMarket = last > ma;
  const gapPct = (last/ma - 1) * 100;

  document.getElementById("sigBadge").className = "badge " + (inMarket ? "in" : "out");
  document.getElementById("sigBadge").textContent = inMarket ? "🟢 در بازار بمان" : "🔴 نقد باش";
  document.getElementById("sigSub").textContent = inMarket
    ? "قیمت بالای میانگین است — بیت‌کوین نگه دار"
    : "قیمت زیر میانگین است — تتر نگه دار";

  document.getElementById("price").textContent = usd(last);
  document.getElementById("ma").textContent = usd(ma);
  const g = document.getElementById("gap");
  g.textContent = (gapPct>=0?"+":"") + gapPct.toFixed(1) + "٪";
  g.className = "v " + (inMarket ? "in" : "out");

  drawChart(rows.slice(-180), MA_DAYS, closes);
}

function drawChart(rows, maDays, allCloses){
  const svg = document.getElementById("chart");
  const W = 320, H = 110, pad = 6;
  // میانگین متحرک برای هر نقطه‌ی نمودار
  const startIdx = allCloses.length - rows.length;
  const maSeries = rows.map((_,i)=>{
    const end = startIdx + i + 1;
    const win = allCloses.slice(Math.max(0,end-maDays), end);
    return win.length ? win.reduce((a,b)=>a+b,0)/win.length : null;
  });
  const vals = rows.map(r=>r.c).concat(maSeries.filter(v=>v!=null));
  const min = Math.min(...vals), max = Math.max(...vals);
  const rng = (max-min) || 1;
  const X = i => pad + i * (W-2*pad) / Math.max(1, rows.length-1);
  const Y = v => H - pad - (v-min)/rng * (H-2*pad);
  const path = (arr,get) => arr.map((d,i)=>{
    const v = get(d); if(v==null) return null;
    return (i===0?"M":"L") + X(i).toFixed(1) + " " + Y(v).toFixed(1);
  }).filter(Boolean).join(" ");

  svg.innerHTML =
    `<path d="${path(maSeries,v=>v)}" fill="none" stroke="var(--amber)" stroke-width="1.6"/>` +
    `<path d="${path(rows,r=>r.c)}" fill="none" stroke="var(--blue)" stroke-width="1.8"/>`;
}

// ---------- سبد (از فایل ربات روی گیت‌هاب) ----------
async function loadPortfolio(){
  const body = document.getElementById("portBody");
  let p;
  try{
    const r = await fetch("./portfolio.json?t=" + Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error("not found");
    p = await r.json();
  }catch(e){
    body.innerHTML = `<div class="err">هنوز اطلاعاتی از ربات منتشر نشده.<br>
      <span class="muted">بعد از اولین اجرای ربات روی کامپیوتر، اینجا پر می‌شود.</span></div>`;
    return;
  }

  const holds = p["دارایی‌ها"] || [];
  const usdt = p["تتر"] ?? 0;
  const total = p["ارزش_کل_دلار"] ?? 0;
  const mode = p["حالت"] ?? "—";
  const filter = p["فیلتر_بازار"] ?? "—";
  const upd = p["به‌روزرسانی"] ?? "—";

  // اگر بیشتر از ۲ روز از آخرین اجرا گذشته، هشدار بده
  let stale = false;
  const m = /(\d{4})-(\d{2})-(\d{2})/.exec(upd);
  if(m){
    const days = (Date.now() - new Date(+m[1],+m[2]-1,+m[3]).getTime())/86400000;
    stale = days > 2;
  }
  document.getElementById("portCard").className = "card" + (stale ? " stale" : "");

  body.innerHTML = `
    <div class="rows">
      <div class="row"><span class="k">ارزش کل</span>
        <span class="v big">${usd(total)}</span></div>
      <div class="row"><span class="k">تعداد ارزها</span>
        <span class="v">${holds.length}</span></div>
      <div class="row"><span class="k">تتر (نقد)</span>
        <span class="v">${usd(usdt)}</span></div>
      <div class="row"><span class="k">فیلتر بازار</span>
        <span class="v ${filter === "باز" ? "in" : "out"}">${filter === "باز" ? "🟢 باز" : "🔴 بسته"}</span></div>
      <div class="row"><span class="k">حالت ربات</span>
        <span class="v">${mode === "واقعی" ? "🔴 واقعی" : "🧪 آزمایشی"}</span></div>
      <div class="row"><span class="k">آخرین اجرای ربات</span>
        <span class="v" style="font-size:13px">${upd}</span></div>
    </div>
    ${stale ? `<div class="err" style="margin-top:12px">⚠️ بیشتر از ۲ روز است ربات اجرا نشده</div>` : ""}
  `;

  // ---- ارزهای داخل سبد ----
  if(holds.length){
    document.getElementById("holdCard").style.display = "block";
    document.getElementById("holdBody").innerHTML = holds.map(h=>{
      const ok = h["وضعیت"] === "بالای میانگین";
      const share = total > 0 ? (h["ارزش"]/total*100) : 0;
      return `<div class="trade">
        <span>
          <span class="tag ${ok?'buy':'sell'}">${h["ارز"]}</span>
          <span class="muted" style="margin-right:8px; font-size:12px">${share.toFixed(0)}٪ سبد</span>
        </span>
        <span>${usd(h["ارزش"])}
          <span class="muted" style="font-size:11px; margin-right:6px">${ok?"🟢":"🔴"}</span>
        </span>
      </div>`;
    }).join("");
  } else {
    document.getElementById("holdCard").style.display = "none";
  }

  // ---- معاملات ----
  const trades = p["آخرین_معاملات"] || [];
  if(trades.length){
    document.getElementById("tradesCard").style.display = "block";
    document.getElementById("tradesBody").innerHTML = trades.slice().reverse().map(t=>{
      const isBuy = t.action === "buy";
      return `<div class="trade">
        <span><span class="tag ${isBuy?'buy':'sell'}">${isBuy?'خرید':'فروش'}</span>
          <span style="margin-right:8px; font-weight:600">${(t.coin||"").toUpperCase()}</span>
          <span class="muted" style="font-size:12px">${t.date||""}</span></span>
        <span>${usd(t.value_usdt||0)}</span>
      </div>`;
    }).join("");
  }
}

async function loadAll(){
  try{ await loadSignal(); }
  catch(e){
    document.getElementById("sigBadge").textContent = "اتصال ناموفق";
    document.getElementById("sigBadge").className = "badge";
    document.getElementById("sigSub").innerHTML =
      `<span class="err">نوبیتکس در دسترس نیست. اگر فیلترشکن روشن است، خاموشش کن.</span>`;
  }
  await loadPortfolio();
}

loadAll();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
</html>
